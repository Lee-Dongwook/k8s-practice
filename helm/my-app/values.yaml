replicaCount: 2

image:
  repository: ghcr.io/lee-dongwook/k8s-practice
  pullPolicy: IfNotPresent
  tag: "56c4273"

service:
  type: NodePort
  port: 80
  targetPort: 8000

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: my-app.local
      paths:
        - path: /
          pathType: Prefix
