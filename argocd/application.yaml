apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Lee-Dongwook/k8s-practice.git
    targetRevision: main
    path: helm/my-app
    helm:
      releaseName: my-release # 기존 helm release 리소스를 그대로 인수
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
